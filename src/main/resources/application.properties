#Nombre de la aplicacion
spring.application.name=backend

# ============================================
# Configuración de la base de datos
# ============================================
# En local: usa PostgreSQL local por defecto.
# En Render: las variables de entorno SPRING_DATASOURCE_* sobrescriben estos valores.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mi_lista}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# Configuración de Hibernate / JPA
# ============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ============================================
# Configuración de JWT
# ============================================
jwt.secret=${JWT_SECRET_KEY:EstaEsLaClaveSecretaDeSantiagoOjeda}
jwt.expiration=600000
