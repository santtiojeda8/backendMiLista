#Nombre de la aplicacion
spring.application.name=backend

#Configuración de la conexión con la base de datos (MySQL)
#spring.datasource.url=jdbc:mysql://localhost:3306/MiLista?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/MiLista?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

#Configuración de la conexión con la base de datos (PostgresSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/mi_lista
spring.datasource.username=root
spring.datasource.password=root1234

#Driver de MySQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
# 'validate' comprueba que las entidades Java coincidan con las tablas que creamos en MySQL
# Cambiamos 'validate' a 'update' para que se creen las tablas solas según las entidades de Java.
spring.jpa.hibernate.ddl-auto=update

#Configuarción de clave secreta de JWT y del tiempo de expiración del token.
jwt.secret=${JWT_SECRET_KEY:EstaEsLaClaveSecretaDeSantiagoOjeda}
jwt.expiration=600000