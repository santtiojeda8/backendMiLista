#Nombre de la aplicacion
spring.application.name=backend

#Configuración de la conexión con la base de datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/MiLista?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

#Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
# "validate" comprueba que las entidades Java coincidan con las tablas que creamos en MySQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
